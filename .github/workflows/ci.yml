name: EdgeTwin-2S CI & Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Pytest & Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Repository Hygiene
        run: |
          echo "Checking for duplicate artifacts and redundant trees..."
          test ! -f scripts/models/random_forest.joblib || { echo "Duplicate model found!"; exit 1; }
          test ! -d data/raw/SKAB-master || { echo "Duplicate SKAB-master tree found!"; exit 1; }
          test ! -d data/raw/skab/data || { echo "Duplicate skab/data tree found!"; exit 1; }
          test -f models/random_forest.joblib || { echo "Canonical model bundle missing!"; exit 1; }
          echo "Repository hygiene clean: zero redundant trees detected."

      - name: Run Cross-Regime & Held-Out Evaluation
        run: |
          python scripts/ml/evaluate_skab_heldout.py

      - name: Run C-MAPSS RUL Prognostics Module
        run: |
          python scripts/ml/cmapss_rul.py

      - name: Execute Full PyTest Suite
        run: |
          pytest tests/ -v

      - name: Verify Reports Generated
        run: |
          test -f reports/training_manifest.json || { echo "Missing training manifest!"; exit 1; }
          test -f reports/cross_regime_evaluation.json || { echo "Missing cross regime report!"; exit 1; }
          test -f reports/cmapss_rul_metrics.json || { echo "Missing C-MAPSS RUL report!"; exit 1; }
          test -f reports/latency_benchmark.json || { echo "Missing latency benchmark report!"; exit 1; }
          echo "All reports generated and verified."

  docker-build:
    name: Container Build & Sanity Test
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t edgetwin-2s:latest .

      - name: Run PyTest Inside Container
        run: |
          docker run --rm edgetwin-2s:latest pytest tests/ -v
